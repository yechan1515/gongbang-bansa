<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공방반사</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#101522;color:#f5f7ff;font-family:system-ui,sans-serif;text-align:center}
h1{color:#8ee8ff}
.card{max-width:520px;margin:14px auto;padding:18px;background:#1c2639;border-radius:18px}
input,button{font:inherit;border:0;border-radius:10px;padding:12px}
input{display:block;width:100%;margin:8px 0}
button{background:#65d7f2;color:#10202c;font-weight:bold;margin:4px;cursor:pointer}
button:disabled{opacity:.4}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{min-height:65px;font-size:18px}
.stats{display:flex;justify-content:space-around;gap:12px}
.hp{font-size:28px;font-weight:bold}
.muted{color:#bac7dd;font-size:13px}
.hidden{display:none}
#status{white-space:pre-line;line-height:1.6}
#log{text-align:left;max-height:220px;overflow:auto;line-height:1.8}
footer{font-size:12px;color:#9aa8bd;line-height:1.8;margin:25px}
</style>
</head>
<body>

<h1>⚔️ 공방반사</h1>
<p class="muted">온라인 2인 실시간 대전</p>

<section class="card" id="lobby">
<h2>온라인 대전</h2>
<input id="playerName" maxlength="12" placeholder="내 이름">
<input id="roomCode" maxlength="12" placeholder="참가할 방 코드">
<button id="createBtn">방 만들기</button>
<button id="joinBtn">방 참가</button>
<p id="lobbyStatus" class="muted">Firebase 연결 중...</p>
</section>

<section class="card">
<h3>게임 설정</h3>
<label>시작 HP</label>
<input id="hpSetting" type="number" min="1" max="99" value="10">
<label>선택 제한 시간 (초)</label>
<input id="timeSetting" type="number" min="5" max="60" value="15">
<p class="muted">방을 만드는 사람의 설정이 적용됩니다.</p>
</section>

<section class="card hidden" id="game">
<p>방 코드: <b id="roomLabel"></b></p>
<button id="copyBtn">방 코드 복사</button>

<div class="stats">
<div>
<div id="name0">플레이어 1</div>
<div class="hp" id="hp0">❤️ 10</div>
<div class="muted" id="reflect0">반사 준비됨</div>
</div>
<div>
<div id="name1">플레이어 2</div>
<div class="hp" id="hp1">❤️ 10</div>
<div class="muted" id="reflect1">반사 준비됨</div>
</div>
</div>

<hr style="border-color:#35435c;margin:18px 0">
<p id="roundLabel">라운드 1</p>
<div class="hp" id="timer">--</div>
<p id="status">상대방을 기다리는 중...</p>

<div class="actions">
<button data-action="attack">⚔️ 공격</button>
<button data-action="defend">🛡️ 방어</button>
<button data-action="reflect">🔁 반사</button>
<button data-action="pass">⏭️ 패스</button>
</div>

<p class="muted">공격은 피해 1 · 방어는 공격 차단</p>
<p class="muted">반사는 공격을 되돌리고, 패스는 반사를 재충전합니다.</p>

<h3>전투 기록</h3>
<div id="log"></div>
<button id="leaveBtn">로비로 돌아가기</button>
</section>

<footer>
공방반사<br>
총괄 · 아이디어 : 이예찬<br>
제작 · 코딩 : ChatGPT<br>
© 2026
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDArGtDypSSmWo6BiHDtQBaK5JeIkN0v14",
  authDomain: "miniboardgame-25324.firebaseapp.com",
  databaseURL: "https://miniboardgame-25324-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "miniboardgame-25324",
  storageBucket: "miniboardgame-25324.firebasestorage.app",
  messagingSenderId: "937903418490",
  appId: "1:937903418490:web:723c9d64bdecb0fe0c5fc3"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);
const actionNames = {
  attack: "공격",
  defend: "방어",
  reflect: "반사",
  pass: "패스"
};

let uid = null;
let roomId = null;
let mySlot = -1;
let roomRef = null;
let listener = null;
let roomData = null;
let clock = null;
let advancing = false;
let lastLoggedRound = 0;
let advanceTimer = null;

function say(text) {
  $("lobbyStatus").textContent = text;
}

function getName() {
  return ($("playerName").value.trim() || "플레이어").slice(0, 12);
}

function makeCode() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}

function setButtons(enabled) {
  document.querySelectorAll("[data-action]").forEach(button => {
    button.disabled = !enabled;
  });
}

function stopClock() {
  if (clock) clearInterval(clock);
  clock = null;
}

function disconnectRoom() {
  stopClock();

  if (roomRef && listener) {
    roomRef.off("value", listener);
  }

  if (advanceTimer) clearTimeout(advanceTimer);
  advanceTimer = null;

  roomRef = null;
  listener = null;
  roomData = null;
  roomId = null;
  mySlot = -1;
  advancing = false;
  lastLoggedRound = 0;
}

function showGame() {
  $("lobby").classList.add("hidden");
  $("game").classList.remove("hidden");
}

function showLobby() {
  $("game").classList.add("hidden");
  $("lobby").classList.remove("hidden");
}

function addLog(text) {
  const item = document.createElement("div");
  item.textContent = text;
  $("log").prepend(item);
}

async function createRoom() {
  if (!uid) return say("로그인 중입니다. 잠시 기다려 주세요.");

  const id = makeCode();
  const hp = Math.max(1, Math.min(99, Number($("hpSetting").value) || 10));
  const seconds = Math.max(5, Math.min(60, Number($("timeSetting").value) || 15));

  const room = {
    host: uid,
    status: "waiting",
    settings: { hp, seconds },
    round: 1,
    resolvedRound: 0,
    players: {
      0: { uid, name: getName(), hp, reflectReady: true },
      1: null
    },
    choices: {},
    history: {},
    deadline: null,
    updatedAt: Date.now()
  };

  try {
    await db.ref("rooms/" + id).set(room);
    await enterRoom(id, 0);
  } catch (error) {
    say("방 생성 실패: " + error.message);
  }
}

async function joinRoom() {
  if (!uid) return say("로그인 중입니다. 잠시 기다려 주세요.");

  const id = $("roomCode").value.trim().toUpperCase()
    .replace(/[^A-Z0-9_-]/g, "").slice(0, 12);

  if (!id) return say("방 코드를 입력하세요.");

  const ref = db.ref("rooms/" + id);

  try {
    const result = await ref.transaction(room => {
      if (!room || room.status !== "waiting") return;
      if (!room.players || !room.players[0] || room.players[1]) return;
      if (room.players[0].uid === uid) return;

      const hp = Number(room.settings.hp) || 10;

      room.players[1] = {
        uid,
        name: getName(),
        hp,
        reflectReady: true
      };

      room.status = "playing";
      room.round = 1;
      room.resolvedRound = 0;
      room.choices = {};
      room.deadline = Date.now() + (Number(room.settings.seconds) || 15) * 1000;
      room.updatedAt = Date.now();

      return room;
    }, undefined, false);

    if (!result.committed) {
      say("참가 실패: 방이 없거나 이미 시작했거나 꽉 찼습니다.");
      return;
    }

    if (!result.snapshot.val().players[1] ||
        result.snapshot.val().players[1].uid !== uid) {
      say("방 참가에 실패했습니다.");
      return;
    }

    await enterRoom(id, 1);
  } catch (error) {
    say("참가 실패: " + error.message);
  }
}

async function enterRoom(id, slot) {
  disconnectRoom();

  roomId = id;
  mySlot = slot;
  roomRef = db.ref("rooms/" + id);

  $("roomLabel").textContent = id;
  $("log").innerHTML = "";

  showGame();

  listener = roomRef.on("value", snapshot => {
    roomData = snapshot.val();

    if (!roomData) {
      $("status").textContent = "방이 삭제되었습니다.";
      setButtons(false);
      return;
    }

    renderRoom(roomData);
  }, error => {
    $("status").textContent = "연결 오류: " + error.message;
  });
}

function renderRoom(room) {
  const p = room.players || {};

  $("name0").textContent = p[0] ? p[0].name : "플레이어 1";
  $("name1").textContent = p[1] ? p[1].name : "상대방 대기 중";
  $("hp0").textContent = "❤️ " + (p[0] ? p[0].hp : "—");
  $("hp1").textContent = "❤️ " + (p[1] ? p[1].hp : "—");

  $("reflect0").textContent =
    p[0] && p[0].reflectReady ? "반사 준비됨" : "반사 사용함";

  $("reflect1").textContent =
    p[1] && p[1].reflectReady ? "반사 준비됨" : "반사 사용함";

  $("roundLabel").textContent = "라운드 " + (room.round || 1);

  showRoundLog(room);

  if (room.status === "waiting") {
    $("status").textContent = "방 코드를 상대방에게 알려 주세요.";
    $("timer").textContent = "대기 중";
    stopClock();
    setButtons(false);
    return;
  }

  if (room.status === "finished") {
    stopClock();
    setButtons(false);

    $("status").textContent = room.winner === "draw"
      ? "무승부!"
      : p[room.winner].name + " 승리!";

    $("timer").textContent = "종료";
    return;
  }

  if (room.status === "result") {
    stopClock();
    setButtons(false);
    $("status").textContent = room.lastResult || "라운드 결과";
    $("timer").textContent = "결과";
    scheduleNextRound(room);
    return;
  }

  const mine = room.choices && room.choices[mySlot];
  const theirs = room.choices && room.choices[1 - mySlot];

  if (mine) {
    $("status").textContent = theirs
      ? "두 플레이어가 모두 선택했습니다."
      : "선택 완료! 상대방을 기다리는 중...";
    setButtons(false);
  } else {
    $("status").textContent = "행동을 선택하세요!";
    setButtons(true);
  }

  startClock(room);
  resolveIfReady(room);
}

function startClock(room) {
  stopClock();

  function tick() {
    if (!roomData || roomData.status !== "playing") return;

    const remaining = Math.max(
      0,
      Math.ceil(((roomData.deadline || 0) - Date.now()) / 1000)
    );

    $("timer").textContent = remaining + "초";

    if (remaining <= 0) timeoutRound();
  }

  tick();
  clock = setInterval(tick, 250);
}

async function timeoutRound() {
  if (!roomRef || !roomData || roomData.status !== "playing" || advancing) return;
  if (Date.now() < (roomData.deadline || 0)) return;

  advancing = true;

  try {
    await roomRef.transaction(room => {
      if (!room || room.status !== "playing") return;
      if (Date.now() < (room.deadline || 0)) return;

      room.choices = room.choices || {};

      for (const slot of [0, 1]) {
        if (!room.choices[slot]) {
          room.choices[slot] = {
            action: "pass",
            at: room.deadline,
            timeout: true
          };
        }
      }

      return room;
    }, undefined, false);
  } catch (error) {
    $("status").textContent = "시간 종료 처리 실패: " + error.message;
  } finally {
    advancing = false;
  }

  if (roomData) resolveIfReady(roomData);
}

async function chooseAction(action) {
  const room = roomData;

  if (!room || room.status !== "playing" || advancing) return;
  if (room.choices && room.choices[mySlot]) return;

  const me = room.players && room.players[mySlot];

  if (!me || me.uid !== uid) {
    $("status").textContent = "플레이어 정보를 확인할 수 없습니다.";
    return;
  }

  if (action === "reflect" && !me.reflectReady) {
    $("status").textContent = "반사가 없습니다. 패스로 재충전하세요.";
    return;
  }

  setButtons(false);

  try {
    const result = await roomRef.child("choices/" + mySlot)
      .transaction(existing => {
        if (existing) return;
        if (!roomData || roomData.status !== "playing") return;
        if (Date.now() >= (roomData.deadline || 0)) return;

        return { action, at: Date.now() };
      }, undefined, false);

    if (!result.committed) {
      $("status").textContent = "선택 실패. 화면 상태를 확인하세요.";
    }
  } catch (error) {
    $("status").textContent = "선택 오류: " + error.message;
  }
}

async function resolveIfReady(room) {
  if (!roomRef || !room || room.status !== "playing" || advancing) return;

  const choices = room.choices || {};
  if (!choices[0] || !choices[1]) return;

  advancing = true;
  stopClock();

  try {
    await roomRef.transaction(data => {
      if (!data || data.status !== "playing") return;

      const c = data.choices || {};
      if (!c[0] || !c[1]) return;
      if (data.resolvedRound >= data.round) return;

      const players = data.players;
      const a = c[0].action;
      const b = c[1].action;
      const messages = [];

      function damage(slot, amount, reason) {
        players[slot].hp = Math.max(0, players[slot].hp - amount);
        messages.push(players[slot].name + " 피해 -" + amount + " (" + reason + ")");
      }

      function attack(attacker, defender, defenderAction) {
        const target = players[defender];

        if (defenderAction === "defend") {
          messages.push(target.name + " 방어 성공!");
        } else if (defenderAction === "reflect" && target.reflectReady) {
          target.reflectReady = false;
          damage(attacker, 1, "반사");
          messages.push(target.name + " 반사 성공!");
        } else {
          damage(defender, 1, "공격");
        }
      }

      if (a === "attack" && b === "attack") {
        const delta = Math.abs(c[0].at - c[1].at);

        if (delta <= 2000) {
          if (c[0].at === c[1].at) {
            messages.push("동시 공격! 두 공격 모두 실패!");
          } else {
            const faster = c[0].at < c[1].at ? 0 : 1;
            damage(1 - faster, 1, "빠른 공격");
            messages.push(players[faster].name + "의 공격이 먼저 적중!");
          }
        } else {
          const faster = c[0].at < c[1].at ? 0 : 1;
          damage(1 - faster, 1, "빠른 공격");
        }
      } else {
        if (a === "attack") attack(0, 1, b);
        if (b === "attack") attack(1, 0, a);
      }

      if (a === "pass") {
        players[0].reflectReady = true;
        messages.push(players[0].name + " 반사 재충전!");
      }

      if (b === "pass") {
        players[1].reflectReady = true;
        messages.push(players[1].name + " 반사 재충전!");
      }

      data.history = data.history || {};
      data.history[data.round] = {
        actions: { 0: a, 1: b },
        messages,
        at: Date.now()
      };

      data.resolvedRound = data.round;
      data.lastResult = messages.join("\n");
      data.updatedAt = Date.now();

      if (players[0].hp <= 0 && players[1].hp <= 0) {
        data.status = "finished";
        data.winner = "draw";
      } else if (players[0].hp <= 0) {
        data.status = "finished";
        data.winner = 1;
      } else if (players[1].hp <= 0) {
        data.status = "finished";
        data.winner = 0;
      } else {
        data.status = "result";
        data.nextRoundAt = Date.now() + 1800;
      }

      return data;
    }, undefined, false);
  } catch (error) {
    $("status").textContent = "라운드 처리 실패: " + error.message;
  } finally {
    advancing = false;
  }
}

function showRoundLog(room) {
  const round = room.resolvedRound || 0;

  if (!round || round <= lastLoggedRound) return;

  const record = room.history && room.history[round];
  if (!record) return;

  lastLoggedRound = round;

  addLog("— 라운드 " + round + " —");
  addLog("나: " + actionNames[record.actions[mySlot]]);
  addLog("상대: " + actionNames[record.actions[1 - mySlot]]);

  (record.messages || []).forEach(addLog);
}

function scheduleNextRound(room) {
  if (!room.nextRoundAt || advanceTimer) return;

  const round = room.round;

  advanceTimer = setTimeout(async () => {
    advanceTimer = null;

    try {
      await roomRef.transaction(data => {
        if (!data || data.status !== "result") return;
        if (data.round !== round) return;

        data.round += 1;
        data.choices = {};
        data.status = "playing";
        data.deadline = Date.now() + (Number(data.settings.seconds) || 15) * 1000;
        data.updatedAt = Date.now();

        return data;
      }, undefined, false);
    } catch (error) {
      $("status").textContent = "다음 라운드 시작 실패: " + error.message;
    }
  }, Math.max(0, room.nextRoundAt - Date.now()));
}

document.querySelectorAll("[data-action]").forEach(button => {
  button.addEventListener("click", () => chooseAction(button.dataset.action));
});

$("createBtn").addEventListener("click", createRoom);
$("joinBtn").addEventListener("click", joinRoom);

$("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(roomId);
    $("status").textContent = "방 코드를 복사했습니다!";
  } catch {
    prompt("방 코드를 복사하세요.", roomId);
  }
});

$("leaveBtn").addEventListener("click", () => {
  disconnectRoom();
  showLobby();
  say("로비로 돌아왔습니다.");
});

auth.signInAnonymously()
  .then(credential => {
    uid = credential.user.uid;
    say("로그인 완료! 방을 만들거나 참가하세요.");
  })
  .catch(error => {
    say("로그인 실패: " + error.message +
      "\nFirebase Authentication에서 익명 로그인을 활성화하세요.");
  });
</script>
</body>
</html>
